name: Deploy Web + Release APK

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env com chave da API do TMDB
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Build web (Expo export)
        run: npx expo export --platform web

      - name: Criar .nojekyll para desativar Jekyll no GitHub Pages
        run: touch dist/.nojekyll

      - name: Upload artefato para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: deploy-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-android:
    needs: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env com chave da API do TMDB
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Gerar projeto Android com Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Permissão de execução no gradlew
        run: chmod +x android/gradlew

      - name: Build APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
