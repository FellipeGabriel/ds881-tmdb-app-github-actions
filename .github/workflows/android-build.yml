name: Android - Build APK (Validação PR)

on:
  pull_request:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env com chave da API do TMDB
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Gerar projeto Android com Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Permissão de execução no gradlew
        run: chmod +x android/gradlew

      - name: Build APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release-pr-${{ github.event.pull_request.number || github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
